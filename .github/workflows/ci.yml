name: CI

on:
  push:
  pull_request:

jobs:
  jvm:
    name: core + CLI, and the long fuzz runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Pjvm-only :core:test :cli:test :cli:installDist
      - name: 20,000 seeds of the correct merge
        run: cli/build/install/fieldlog/bin/fieldlog fuzz hunt --seeds 20000
      - name: every deliberate bug caught
        run: cli/build/install/fieldlog/bin/fieldlog fuzz mutants --seeds 2000
      - run: cli/build/install/fieldlog/bin/fieldlog demo

  strata:
    name: the export, read by the real strata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make strata-check

  apk:
    name: APK + app unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fieldlog-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  device:
    name: UI tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew :app:connectedDebugAndroidTest

  docker:
    name: make test and make apk, the way the README says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make apk
      - run: ls -la app/build/outputs/apk/debug/app-debug.apk
